name: Mobile

# The Android and iOS apps: the Rust engine cross-compiled for each, the apps built, their unit
# tests, and instrumented tests on an Android emulator and an iPhone simulator. Bluetooth cannot
# be tested on either: see docs/MOBILE.md for the two-phone checklist.
on:
  pull_request:
  push:
    branches: [main, "mobile*"]

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  android:
    name: Android (build, unit tests, lint, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Rust engine and Kotlin bindings
        run: mobile/scripts/build-android.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, unit tests, lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest testDebugUnitTest lintDebug
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/reports/
          retention-days: 14

  ios:
    name: iOS (build, HushKit tests, simulator)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
      - name: Rust engine (XCFramework) and Swift bindings
        run: mobile/scripts/build-ios.sh
      - name: HushKit tests (on this Mac)
        working-directory: mobile/ios/HushKit
        run: swift test
      - run: brew install xcodegen
      - name: App, unit and UI tests (simulator)
        working-directory: mobile/ios
        run: |
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project Hush.xcodeproj -scheme Hush -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO test > build.log 2>&1 || { grep -E "error:" build.log | head -50; tail -100 build.log; exit 1; }
          grep -E "Test Suite .* (passed|failed)|Executed|\*\* TEST" build.log | tail -20
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: mobile/ios/build.log
          retention-days: 14
