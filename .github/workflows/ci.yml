name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Must match the wasm-bindgen crate in Cargo.lock (web/scripts/build-wasm.ts checks it).
  WASM_BINDGEN: 0.2.128

jobs:
  rust:
    name: Rust (fmt, clippy, tests, wasm, mobile bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test -p hush-core --no-default-features --locked
      - name: One getrandom in the WebAssembly build
        run: |
          n=$(cargo tree -p hush-wasm --target wasm32-unknown-unknown -e normal -i getrandom --prefix none 2>/dev/null | grep -c '^getrandom' || true)
          echo "getrandom versions in the wasm build: $n"
          [ "$n" -le 1 ]
      - run: cargo build -p hush-wasm --profile wasm --target wasm32-unknown-unknown --locked
      - name: Kotlin and Swift bindings generate
        run: |
          cargo build -p hush-ffi --profile ffi --locked
          cargo run -p hush-ffi --features cli --bin uniffi-bindgen --locked -- generate --library target/ffi/libhush_ffi.so --language kotlin --out-dir bindings/kotlin --no-format
          cargo run -p hush-ffi --features cli --bin uniffi-bindgen --locked -- generate --library target/ffi/libhush_ffi.so --language swift --out-dir bindings/swift
          ls -R bindings

  deny:
    name: Dependencies (advisories, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources

  fuzz:
    name: Fuzz the parsers (a minute each)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal && cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz
        working-directory: crates/hush-core/fuzz
        run: |
          for t in parsers framing handshake session; do
            cargo +nightly fuzz run "$t" -- -max_total_time=60 -rss_limit_mb=4096
          done

  web:
    name: Web (typecheck, lint, unit, build, size)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run wasm
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bun run check-size

  e2e:
    name: End-to-end (Chromium, phone, CLI interop)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
      - run: cargo build -p hush-cli --locked && cargo build -p hush-app --example peer --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run wasm
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e --project=chromium --project=mobile
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-chromium
          path: web/test-results/
          retention-days: 7

  e2e-webkit:
    # Playwright's Linux WebKit cannot open WebRTC connections: Safari's engine is tested on macOS.
    name: End-to-end (WebKit)
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo install wasm-bindgen-cli --version "$WASM_BINDGEN" --locked
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun run wasm
      - run: bunx playwright install webkit
      - run: bun run test:e2e --project=webkit
        env:
          CI: "true"
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-webkit
          path: web/test-results/
          retention-days: 7

  # The phone apps: the Rust engine cross-compiled, the apps built and tested on an Android
  # emulator and an iPhone simulator. Bluetooth cannot be tested on either: docs/MOBILE.md has the
  # two-phone checklist.
  android:
    name: Android (build, unit tests, lint, emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Android NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal --target aarch64-linux-android,x86_64-linux-android && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: android
          # The engine takes most of the job: keep it even when a later step fails.
          cache-on-failure: true
      - run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Rust engine and Kotlin bindings
        run: mobile/scripts/build-android.sh
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build, unit tests, lint
        working-directory: mobile/android
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest testDebugUnitTest lintDebug
      # A build anyone can install to try the change: "hush debug" (io.github.maxgfr.hush.debug),
      # signed with the runner's debug key, so it sits next to the release app on a phone.
      - name: App to download
        run: |
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk hush-android-debug.apk
          echo "**Android:** download the \`hush-android-debug\` artifact below, unzip it and open \`hush-android-debug.apk\` on the phone or drag it onto an emulator." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hush-android-debug
          path: hush-android-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests (emulator)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: mobile/android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-reports
          path: mobile/android/app/build/reports/
          retention-days: 14

  ios:
    name: iOS (build, HushKit tests, simulator)
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: xcodebuild -version && swift --version
      - run: rustup toolchain install stable --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim && rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ios
      - name: Rust engine (XCFramework) and Swift bindings
        run: mobile/scripts/build-ios.sh
      - name: HushKit tests (on this Mac)
        working-directory: mobile/ios/HushKit
        run: swift test
      - run: brew install xcodegen
      - name: App, unit and UI tests (simulator)
        working-directory: mobile/ios
        run: |
          xcodegen generate
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import sys,json; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild -project Hush.xcodeproj -scheme Hush -destination "id=$DEVICE" \
            CODE_SIGNING_ALLOWED=NO test > build.log 2>&1 || { grep -E "error:" build.log | head -50; tail -100 build.log; exit 1; }
          grep -E "Test Suite .* (passed|failed)|Executed|\*\* TEST" build.log | tail -20
      # Builds anyone can try without an Apple account: the simulator app (Apple silicon Macs), and
      # the device app unsigned, for a sideloading tool to sign with the tester's own account.
      - name: Apps to download
        working-directory: mobile/ios
        run: |
          for sdk in iphonesimulator iphoneos; do
            xcodebuild -project Hush.xcodeproj -scheme Hush -configuration Release -sdk "$sdk" \
              -derivedDataPath "build/$sdk" ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build > "build/$sdk.log" 2>&1 \
              || { grep -E "error:" "build/$sdk.log" | head -50; tail -50 "build/$sdk.log"; exit 1; }
          done
          mkdir -p "$RUNNER_TEMP/apps/Payload"
          ditto -c -k --keepParent build/iphonesimulator/Build/Products/Release-iphonesimulator/Hush.app \
            "$GITHUB_WORKSPACE/hush-ios-simulator.zip"
          cp -R build/iphoneos/Build/Products/Release-iphoneos/Hush.app "$RUNNER_TEMP/apps/Payload/"
          (cd "$RUNNER_TEMP/apps" && zip -qry "$GITHUB_WORKSPACE/hush-ios-unsigned.ipa" Payload)
          {
            echo "**iOS:** download the \`hush-ios\` artifact below."
            echo "- Simulator: unzip \`hush-ios-simulator.zip\` and drag \`Hush.app\` onto a booted simulator, or \`xcrun simctl install booted Hush.app\`."
            echo "- iPhone: \`hush-ios-unsigned.ipa\` has to be signed with your Apple account first (Sideloadly, AltStore, or Xcode)."
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hush-ios
          path: |
            hush-ios-simulator.zip
            hush-ios-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-logs
          path: mobile/ios/build.log
          retention-days: 14
