# cargo deny check: known vulnerabilities, licenses and where crates come from.

[graph]
all-features = true

[advisories]
# Any vulnerability fails the build; unmaintained crates are reported for direct and transitive
# dependencies alike, and ignored only with a reason below.
unmaintained = "all"
ignore = [
    # `basic-toml`, pulled in by uniffi's build-time macros; only reads the crate's own uniffi.toml.
    { id = "RUSTSEC-2026-0374", reason = "build-time only, parses our own config" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
