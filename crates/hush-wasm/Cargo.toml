[package]
name = "hush-wasm"
description = "WebAssembly bindings of hush-core for the web app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hush-core = { path = "../hush-core", default-features = false }
wasm-bindgen = "=0.2.128"
js-sys = "0.3"
rand_core = "=0.10.1"
getrandom = { version = "=0.4.3", features = ["sys_rng", "wasm_js"] }
