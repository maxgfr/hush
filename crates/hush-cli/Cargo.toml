[package]
name = "hush-cli"
description = "Command-line client for hush: post-quantum, end-to-end encrypted chat and file transfer with the web app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
hush-core = { path = "../hush-core" }
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
rand_core = "=0.10.1"
webrtc = "=0.20.5"
rtc = "=0.20.5"
async-trait = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "io-std", "signal"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
k256 = { version = "0.13", features = ["schnorr"] }
rand = "0.8"
clap = { version = "4", features = ["derive", "env"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
hex = "0.4"
anyhow = "1"
sha2 = "0.10"
