[package]
name = "hush-cli"
description = "Command-line client for hush: post-quantum, end-to-end encrypted chat and file transfer with the web app"
version = "3.1.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "hush"
path = "src/main.rs"

[dependencies]
hush-core = { path = "../hush-core" }
hush-app = { path = "../hush-app" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "io-std", "signal"] }
clap = { version = "4", features = ["derive", "env"] }
qrcode = { version = "0.14", default-features = false }
serde_json = "1"
anyhow = "1"
