[package]
name = "hush-ffi"
description = "UniFFI bindings of the hush engine for the Android (Kotlin) and iOS (Swift) apps"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "hush_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["cli"]

[features]
cli = ["uniffi/cli"]

[dependencies]
hush-core = { path = "../hush-core" }
hush-app = { path = "../hush-app" }
tokio = { version = "1", features = ["rt-multi-thread"] }
anyhow = "1"
uniffi = "=0.32.2"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
rand_core = "=0.10.1"
thiserror = "2"

# libc 0.2.190 made SYSPROTO_CONTROL macOS-only, which breaks nix 0.31 (under webrtc) on iOS.
# Pinned until either is fixed; the lock file resolves it for every target.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"
