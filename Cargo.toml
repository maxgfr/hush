[workspace]
resolver = "3"
members = ["crates/hush-core", "crates/hush-wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/maxgfr/hush"
rust-version = "1.90"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The web build optimizes for size: `cargo build --profile wasm --target wasm32-unknown-unknown`.
[profile.wasm]
inherits = "release"
opt-level = "z"
