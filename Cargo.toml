[workspace]
resolver = "3"
members = ["crates/hush-core", "crates/hush-wasm", "crates/hush-app", "crates/hush-cli", "crates/hush-ffi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/maxgfr/hush"
rust-version = "1.90"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# The web build optimizes for size: `cargo build --profile wasm --target wasm32-unknown-unknown`.
[profile.wasm]
inherits = "release"
opt-level = "z"

# Mobile libraries: UniFFI reads its metadata from the library's symbols, so it must not be stripped.
[profile.ffi]
inherits = "release"
strip = false

# Tests and debug builds run the crypto at full speed: unoptimized SHA-256, Argon2 and ML-KEM make
# proofs of work and vault unlocks take tens of seconds on CI runners.
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.ml-kem]
opt-level = 3
[profile.dev.package.ml-dsa]
opt-level = 3
